 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جلابة مغربية عصرية — طلب فوري (الدفع عند الاستلام)</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body { margin: 0; background: #f6f4f0; color: #1f1f1f; line-height: 1.6; }
    .container { max-width: 560px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
    .badge { display: inline-block; background: #1f1f1f; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    h1 { font-size: 22px; margin: 10px 0 6px; }
    .price { font-size: 24px; font-weight: bold; color: #7a1c24; margin: 8px 0; }
    .old-price { font-size: 15px; color: #888; text-decoration: line-through; margin-right: 8px; }
    label { display: block; font-weight: bold; margin: 10px 0 5px; font-size: 14px; }
    input, select, textarea {
      width: 100%; padding: 11px 12px; border: 1px solid #d5d0c8; border-radius: 9px;
      font-size: 15px; background: #fcfbfa;
    }
    .colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
    .color-btn {
      border: 1.5px solid #d5d0c8; background: #fff; border-radius: 9px; padding: 9px 6px;
      text-align: center; cursor: pointer; font-size: 13px; font-weight: bold;
    }
    .color-btn.active { border-color: #7a1c24; background: #fdf3f4; color: #7a1c24; }
    .submit-btn {
      width: 100%; margin-top: 16px; padding: 14px; border: none; border-radius: 10px;
      background: #198754; color: #fff; font-size: 17px; font-weight: bold; cursor: pointer;
    }
    .submit-btn:hover { background: #157347; }
    .note { font-size: 12px; color: #555; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <span class="badge">توصيل متوفر • الدفع عند الاستلام</span>
      <h1>جلابة مغربية عصرية أنيقة</h1>
      <div class="price">
        349 درهم
        <span class="old-price">499 درهم</span>
      </div>
      <p style="margin:0; font-size:14px; color:#444;">
        خياطة متقونة وقماش مريح مناسب للإطلالات اليومية والمناسبات. اختاري اللون والمقاس وعمّري معلوماتك للتأكيد عبر واتساب.
      </p>
    </div>

    <form id="orderForm" class="card">
      <label>اختاري اللون:</label>
      <div class="colors" id="colorGroup">
        <button type="button" class="color-btn active" data-color="الأسود الملكي">الأسود الملكي</button>
        <button type="button" class="color-btn" data-color="البوردو">البوردو</button>
        <button type="button" class="color-btn" data-color="البني القرفي">البني القرفي</button>
      </div>
      <input type="hidden" id="color" value="الأسود الملكي" />

      <label for="size">المقاس:</label>
      <select id="size" required>
        <option value="S">S</option>
        <option value="M" selected>M</option>
        <option value="L">L</option>
        <option value="XL">XL</option>
        <option value="XXL">XXL</option>
      </select>

      <label for="pack">الباقة:</label>
      <select id="pack" onchange="updatePrice()">
        <option value="جلابة واحدة (349 درهم)" data-price="349 درهم" selected>جلابة واحدة — 349 درهم</option>
        <option value="جلابتان (649 درهم)" data-price="649 درهم">جلابتان — 649 درهم</option>
      </select>

      <label for="name">الاسم الكامل:</label>
      <input type="text" id="name" placeholder="مثال: سلمى بنعلي" required />

      <label for="phone">رقم الهاتف (واتساب):</label>
      <input type="tel" id="phone" placeholder="مثال: 06XXXXXXXX" required />

      <label for="city">المدينة:</label>
      <input type="text" id="city" placeholder="مثال: مراكش / الدار البيضاء / آسفي" required />

      <label for="address">العنوان بالتفصيل:</label>
      <textarea id="address" rows="2" placeholder="الحي، الشارع، رقم المنزل..." required></textarea>

      <button type="submit" class="submit-btn">أكدي طلبك الآن عبر واتساب</button>
      <div class="note">الدفع نقداً عند استلام طلبيتك — سنتواصل معك لتأكيد التفاصيل.</div>
    </form>
  </div>

  <script>
    // بدّل الرقم التالي برقم الواتساب ديالك بصيغة دولية بدون + أو أصفار بادئة (مثال: 212612345678)
    const WHATSAPP_NUMBER = "212600000000";

    const colorButtons = document.querySelectorAll(".color-btn");
    const colorInput = document.getElementById("color");

    colorButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        colorButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        colorInput.value = btn.getAttribute("data-color");
      });
    });

    function updatePrice() {
      const packSelect = document.getElementById("pack");
      const selectedOption = packSelect.options[packSelect.selectedIndex];
      const priceText = selectedOption.getAttribute("data-price");
      document.querySelector(".price").innerHTML =
        `${priceText} <span class="old-price">${priceText === "349 درهم" ? "499 درهم" : "998 درهم"}</span>`;
    }

    document.getElementById("orderForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const color = colorInput.value;
      const size = document.getElementById("size").value;
      const packSelect = document.getElementById("pack");
      const pack = packSelect.value;
      const price = packSelect.options[packSelect.selectedIndex].getAttribute("data-price");
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const city = document.getElementById("city").value.trim();
      const address = document.getElementById("address").value.trim();

      const message =
`طلب جديد — جلابة مغربية عصرية:
• الاسم الكامل: ${name}
• رقم الهاتف: ${phone}
• المدينة: ${city}
• العنوان: ${address}
• اللون: ${color}
• المقاس: ${size}
• الباقة: ${pack}
• الثمن: ${price}
• طريقة الدفع: الدفع عند الاستلام (COD)`;

      const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank");
    });
  </script>
</body>
</html>
